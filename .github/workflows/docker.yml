name: Build & Push Minecraft Server Images

on:
  push:
    branches: [main, development]
    tags: ['v*']
  repository_dispatch:
    types: [plugin-updated]
  workflow_dispatch:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

# Every run builds all current main plugins, so a superseded pending run loses no update.
concurrency:
  group: minecraft-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ORG: minedesso

jobs:
  download-plugins:
    runs-on: ubuntu-latest
    outputs:
      ban-plugin-version: ${{ steps.ban.outputs.version }}
      lobby-plugin-version: ${{ steps.lobby.outputs.version }}
      essential-plugin-version: ${{ steps.essential.outputs.version }}
      islewars-plugin-version: ${{ steps.islewars.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment scripts and Compose
        run: |
          for script in scripts/deploy.sh scripts/deploy-minecraft scripts/minecraft-ssh; do bash -n "$script"; done
          python3 scripts/test_deployment.py
          docker compose --env-file .env.example config --quiet

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare plugin directories
        run: mkdir -p docker/{lobby,citybuild,islewars}/plugins

      - name: Build ban-plugin
        run: |
          git clone --depth 1 --branch main https://github.com/Minedesso/ban-plugin.git /tmp/ban-plugin
          git -C /tmp/ban-plugin rev-parse HEAD >> "${{ github.workspace }}/plugin-revisions.txt"
          cd /tmp/ban-plugin && mvn -B -ntp clean verify
          cp target/Ban-Plugin-*.jar ${{ github.workspace }}/docker/lobby/plugins/
          cp target/Ban-Plugin-*.jar ${{ github.workspace }}/docker/citybuild/plugins/
          cp target/Ban-Plugin-*.jar ${{ github.workspace }}/docker/islewars/plugins/
          echo "version=$(ls target/Ban-Plugin-*.jar | head -1 | xargs basename)" >> $GITHUB_OUTPUT
        id: ban

      - name: Build lobby-plugin
        run: |
          git clone --depth 1 --branch main https://github.com/Minedesso/lobby-plugin.git /tmp/lobby-plugin
          git -C /tmp/lobby-plugin rev-parse HEAD >> "${{ github.workspace }}/plugin-revisions.txt"
          cd /tmp/lobby-plugin && mvn -B -ntp clean verify
          cp target/lobby-plugin-*.jar ${{ github.workspace }}/docker/lobby/plugins/
          echo "version=$(ls target/lobby-plugin-*.jar | head -1 | xargs basename)" >> $GITHUB_OUTPUT
        id: lobby

      - name: Build essential-plugin
        run: |
          git clone --depth 1 --branch main https://github.com/Minedesso/essential-plugin.git /tmp/essential-plugin
          git -C /tmp/essential-plugin rev-parse HEAD >> "${{ github.workspace }}/plugin-revisions.txt"
          cd /tmp/essential-plugin && mvn -B -ntp clean verify
          cp target/essential-plugin-*.jar ${{ github.workspace }}/docker/citybuild/plugins/
          echo "version=$(ls target/essential-plugin-*.jar | head -1 | xargs basename)" >> $GITHUB_OUTPUT
        id: essential

      - name: Build islewars-plugin
        run: |
          git clone --depth 1 --branch main https://github.com/Minedesso/islewars-plugin.git /tmp/islewars-plugin
          git -C /tmp/islewars-plugin rev-parse HEAD >> "${{ github.workspace }}/plugin-revisions.txt"
          cd /tmp/islewars-plugin && mvn -B -ntp clean verify
          cp target/islewars-plugin-*.jar ${{ github.workspace }}/docker/islewars/plugins/
          echo "version=$(ls target/islewars-plugin-*.jar | head -1 | xargs basename)" >> $GITHUB_OUTPUT
        id: islewars

      - name: Upload source revisions
        uses: actions/upload-artifact@v4
        with:
          name: plugin-revisions
          path: plugin-revisions.txt
          if-no-files-found: error

      - name: Upload lobby plugins
        uses: actions/upload-artifact@v4
        with:
          name: lobby-plugins
          path: docker/lobby/plugins/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload citybuild plugins
        uses: actions/upload-artifact@v4
        with:
          name: citybuild-plugins
          path: docker/citybuild/plugins/*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload islewars plugins
        uses: actions/upload-artifact@v4
        with:
          name: islewars-plugins
          path: docker/islewars/plugins/*.jar
          retention-days: 1
          if-no-files-found: error

  build-lobby:
    needs: [download-plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download lobby plugins
        uses: actions/download-artifact@v4
        with:
          name: lobby-plugins
          path: docker/lobby/plugins

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/lobby
          tags: |
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker/lobby
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-citybuild:
    needs: [download-plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download citybuild plugins
        uses: actions/download-artifact@v4
        with:
          name: citybuild-plugins
          path: docker/citybuild/plugins

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/citybuild
          tags: |
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker/citybuild
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-islewars:
    needs: [download-plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download islewars plugins
        uses: actions/download-artifact@v4
        with:
          name: islewars-plugins
          path: docker/islewars/plugins

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/islewars
          tags: |
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker/islewars
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-lobby, build-citybuild, build-islewars]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Deploy the images built by this run
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy-minecraft $IMAGE_TAG"
